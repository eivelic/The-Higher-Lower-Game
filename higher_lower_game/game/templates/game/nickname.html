<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Unesi nadimak</title>
    <link rel="stylesheet" href="{% static 'game/css/nickname.css' %}">
</head>
<body>
    <video autoplay muted loop playsinline class="background-video">
        <source src="{% static 'game/images/nickname-page-bg-video.mp4' %}" type="video/mp4">
    </video>

    <div class="nickname-container">
        <h1>Dobrodošao!</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Nastavi</button>
        </form>
    </div>
</body>
</html>
