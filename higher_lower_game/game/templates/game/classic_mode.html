<!DOCTYPE html>
{% load static %}
{% load humanize %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Classic Mode</title>
    <link rel="stylesheet" href="{% static 'game/css/classic_mode.css' %}?v=28">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="score-container">
        <div class="high-score">High Score: {{ high_score }}</div>
        <div class="score">Score: {{ score }}</div>
    </div>

    <!-- WRAP both cards inside card-container -->
    <div class="card-container">
        <div class="item-card" id="left-card" style="background-image: url('{{ left_item.image.url }}')">
            <h2>{{ left_item.name }}</h2>
            <p>{{ left_item.monthly_searches|intcomma }} pretraga</p>
        </div>

        <div class="item-card" id="right-card" style="background-image: url('{{ right_item.image.url }}')">
            <h2>{{ right_item.name }}</h2>
            <p>Više ili manje od {{ left_item.name }}?</p>

            <form method="post" action="{% url 'classic_mode' %}">
                {% csrf_token %}
                <button type="submit" name="guess" value="higher">Više</button>
                <button type="submit" name="guess" value="lower">Manje</button>
            </form>
        </div>
    </div>
    <script>
document.addEventListener("DOMContentLoaded", function () {
    const cards = document.querySelectorAll('.item-card');

    // FADE IN
    setTimeout(() => {
        cards.forEach(card => {
            card.style.opacity = '1';
        });
    }, 50);

    // Dodaj event listener za button-e
    const buttons = document.querySelectorAll('.item-card button');

    buttons.forEach(button => {
        button.addEventListener('click', function (e) {
            e.preventDefault();

            const guess = this.value;
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            // Fade out kartica
            cards.forEach(card => {
                card.style.opacity = '0';
            });

            // Nakon 2s submit forme
            setTimeout(() => {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = "{% url 'classic_mode' %}";

                const csrfInput = document.createElement('input');
                csrfInput.type = 'hidden';
                csrfInput.name = 'csrfmiddlewaretoken';
                csrfInput.value = csrfToken;

                const guessInput = document.createElement('input');
                guessInput.type = 'hidden';
                guessInput.name = 'guess';
                guessInput.value = guess;

                form.appendChild(csrfInput);
                form.appendChild(guessInput);
                document.body.appendChild(form);
                form.submit();
            }, 2000);
        });
    });
});
</script>
</body>
</html>
